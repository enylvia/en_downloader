<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>EnylviaDownloader</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .title {
      font-weight: 700;
      font-size: 15px;
    }
    .title span { color: #38bdf8; }
    .status-card {
      background-color: #131a29;
      border: 1px solid #27354f;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .online { background-color: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.6); }
    .offline { background-color: #ef4444; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 12px;
      color: #94a3b8;
    }
    .input-box {
      margin-bottom: 12px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      background-color: #1b2438;
      border: 1px solid #27354f;
      border-radius: 6px;
      padding: 8px 10px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    .btn {
      width: 100%;
      padding: 9px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
      background: #1b2438;
      border: 1px solid #27354f;
      margin-top: 8px;
    }
    .btn-secondary:hover { background: #232e47; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">E</div>
    <div class="title">Enylvia<span>Downloader</span></div>
  </div>

  <div class="status-card">
    <span>Status Engine:</span>
    <span id="server-status"><span class="status-dot offline"></span>Offline</span>
  </div>

  <div class="toggle-row">
    <span>Cegat Download Otomatis:</span>
    <input type="checkbox" id="toggle-intercept" checked>
  </div>

  <div class="input-box">
    <input type="text" id="quick-url" placeholder="Paste link download di sini...">
  </div>

  <button id="btn-quick-download" class="btn">Unduh Cepat</button>
  <button id="btn-open-dashboard" class="btn btn-secondary">Buka Dashboard Aplikasi</button>

  <script src="popup.js"></script>
</body>
</html>
